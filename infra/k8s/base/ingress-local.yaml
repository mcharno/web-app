apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: charno-local
  labels:
    app: web
  annotations:
    # Own certificate: this Ingress referenced a charn-io-wildcard-tls secret
    # that does not exist in this namespace, so nginx served its fake
    # certificate for the host.
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - charno.local.charn.io
    secretName: charno-local-tls
  rules:
  - host: charno.local.charn.io
    http:
      paths:
      # Backend API routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: charno-backend
            port:
              number: 3080
      # Backend-served static assets (photos, ROM box art/screenshots)
      - path: /images/photos
        pathType: Prefix
        backend:
          service:
            name: charno-backend
            port:
              number: 3080
      - path: /images/roms
        pathType: Prefix
        backend:
          service:
            name: charno-backend
            port:
              number: 3080
      - path: /images/berbatis
        pathType: Prefix
        backend:
          service:
            name: charno-backend
            port:
              number: 3080
      - path: /images/comics
        pathType: Prefix
        backend:
          service:
            name: charno-backend
            port:
              number: 3080
      # Frontend routes (catch-all)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: charno-frontend
            port:
              number: 3000
